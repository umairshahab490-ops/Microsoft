name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm install

      - name: Build web app (Vite → dist/)
        run: npm run build

      - name: Verify dist/ exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not found after build"
            exit 1
          fi
          echo "✓ dist/ directory exists"
          ls -la dist/

      - name: Remove existing android/ if present
        run: rm -rf android/

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Verify android/ was created
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android/ directory not created"
            exit 1
          fi
          echo "✓ android/ directory exists"

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Verify Gradle wrapper exists
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Error: gradlew not found in android/"
            exit 1
          fi
          chmod +x android/gradlew
          echo "✓ gradlew exists and is executable"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK was built
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          echo "✓ APK built successfully"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: lite-word-notes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
